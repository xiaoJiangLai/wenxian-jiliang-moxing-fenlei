<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文献计量模型分类索引</title>
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --border:#e5e4df; --text:#222; --muted:#7a7a74;
  --accent:#185FA5; --accent-bg:#E6F1FB;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6;}
header{background:var(--card); border-bottom:1px solid var(--border); padding:28px 40px;}
header h1{font-size:22px; font-weight:600;}
header p{color:var(--muted); font-size:14px; margin-top:6px;}
.wrap{max-width:1180px; margin:0 auto; padding:28px 40px 60px;}
.summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:24px;}
.metric{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px;}
.metric .num{font-size:26px; font-weight:600; color:var(--accent);}
.metric .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
.filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;}
.chip{border:1px solid var(--border); background:var(--card); border-radius:999px; padding:6px 16px; font-size:13px; cursor:pointer; color:#444; transition:all .15s;}
.chip:hover{border-color:var(--accent); color:var(--accent);}
.chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
.chip .cnt{opacity:.65; font-size:11px; margin-left:4px;}
.group{margin-bottom:32px;}
.group-head{display:flex; align-items:baseline; gap:10px; margin-bottom:12px;}
.group-head h2{font-size:17px; font-weight:600;}
.group-head .tag{font-size:12px; color:var(--accent); background:var(--accent-bg); border-radius:6px; padding:2px 8px;}
.group-head .desc{font-size:13px; color:var(--muted);}
.papers{display:grid; grid-template-columns:1fr; gap:8px;}
.paper{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 18px;}
.paper .title{font-size:14px; font-weight:500; margin-bottom:4px;}
.paper .meta{font-size:12px; color:var(--muted);}
.paper .meta b{color:#555; font-weight:500;}
.paper .badge{display:inline-block; font-size:11px; background:var(--accent-bg); color:var(--accent); border-radius:5px; padding:1px 7px; margin-right:4px; margin-bottom:2px;}
.hidden{display:none;}
.footer{color:var(--muted); font-size:12px; text-align:center; margin-top:20px;}
.search-box{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:20px;}
.search-box .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.search-box input[type=text]{flex:1; min-width:220px; padding:9px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none; font-family:inherit;}
.search-box input[type=text]:focus{border-color:var(--accent);}
.search-box button{border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; font-family:inherit;}
.search-box button.ghost{background:transparent; color:var(--accent);}
.kw-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.kw{border:1px solid var(--border); background:#fbfbfa; border-radius:999px; padding:3px 12px; font-size:12px; cursor:pointer; color:#555; transition:all .12s;}
.kw:hover{border-color:var(--accent); color:var(--accent);}
.kw.on{background:var(--accent); color:#fff; border-color:var(--accent);}
.result-bar{font-size:13px; color:var(--muted); margin-bottom:16px;}
.result-bar b{color:var(--accent);}
.result-flat .paper{border-left:3px solid var(--accent); margin-bottom:8px;}
.result-flat .cat-tag{font-size:11px; color:var(--muted); margin-left:8px;}
</style>
</head>
<body>
<header>
  <h1>文献计量模型分类索引</h1>
  <p>共 64 篇经济学文献 · 按核心计量模型归类，点击模型标签即可筛选对应文献</p>
</header>
<div class="wrap">
  <div class="summary" id="summary"></div>

  <div class="search-box">
    <div class="row">
      <input type="text" id="kwInput" placeholder="输入文章标题或作者名，如：断点 / 土地流转 / 孙伟增…">
      <button id="btnClear">清空</button>
      <button id="btnReset" class="ghost">重置</button>
    </div>
    <div class="kw-list" id="kwList"></div>
  </div>

  <div class="result-bar" id="resultBar"></div>

  <div class="filters" id="filters"></div>
  <div id="groups"></div>
  <div class="footer">分类依据每篇文献的核心实证方法（一篇文献可归入多个大类）· 上方输入框可按文章标题/作者检索，并显示其所用计量模型</div>

const summaryEl = document.getElementById('summary');
const filtersEl = document.getElementById('filters');
const groupsEl = document.getElementById('groups');
const kwInput = document.getElementById('kwInput');
const kwListEl = document.getElementById('kwList');
const resultBar = document.getElementById('resultBar');
const btnClear = document.getElementById('btnClear');
const btnReset = document.getElementById('btnReset');

let active = new Set(DATA.map(d=>d.key));

// 关键词标签面板：改为按"模型大类"快速筛选，点击后只显示该大类的文献
function renderKwList(){
  kwListEl.innerHTML = '';
  DATA.forEach(d=>{
    const el = document.createElement('span');
    el.className = 'kw' + (active.size === 1 && active.has(d.key) ? ' on' : '');
    el.innerHTML = `${d.cat} <span style="opacity:.55">${d.papers.length}</span>`;
    el.onclick = ()=>{
      // 点击大类：若已单独选中则恢复全部，否则只保留该大类
      if(active.size === 1 && active.has(d.key)){
        active = new Set(DATA.map(x=>x.key));
      } else {
        active = new Set([d.key]);
      }
      kwInput.value = '';
      render();
    };
    kwListEl.appendChild(el);
  });
}

// 判断某篇文献是否命中检索（仅匹配标题 + 作者）
function paperHit(p, kw){
  const hay = (p.t + ' ' + p.a).toLowerCase();
  return hay.includes(kw.toLowerCase());
}

function render(){
  summaryEl.innerHTML = '';
  filtersEl.innerHTML = '';
  groupsEl.innerHTML = '';
  renderKwList();

  const kw = kwInput.value.trim().toLowerCase();
  const hasSearch = kw.length > 0;

  const total = DATA.reduce((s,d)=>s+d.papers.length,0);
  summaryEl.innerHTML = `
    <div class="metric"><div class="num">${DATA.length}</div><div class="lbl">模型大类</div></div>
    <div class="metric"><div class="num">64</div><div class="lbl">文献总数</div></div>
    <div class="metric"><div class="num">${total}</div><div class="lbl">归类条目(含重复归类)</div></div>
  `;

  // —— 按标题/作者检索文章模式 ——
  if(hasSearch){
    const matches = [];
    const seen = new Set();
    DATA.forEach(d=>{
      d.papers.forEach(p=>{
        const key = p.t + '|' + p.a;
        if(seen.has(key)) return;
        if(paperHit(p, kw)){
          seen.add(key);
          matches.push({cat:d.cat, p});
        }
      });
    });
    resultBar.innerHTML = `检索到 <b>${matches.length}</b> 篇文章`;
    const wrap = document.createElement('div');
    wrap.className = 'result-flat';
    if(matches.length === 0){
      wrap.innerHTML = '<div class="paper" style="border-left-color:#ccc;">没有找到匹配的文章，请检查标题或作者是否输入正确</div>';
    } else {
      wrap.innerHTML = matches.map(({cat,p})=>`
        <div class="paper">
          <div class="title">${p.t}</div>
          <div class="meta"><b>${p.a}</b> · 计量模型：${p.m}<span class="cat-tag">【${cat}】</span></div>
        </div>`).join('');
    }
    groupsEl.appendChild(wrap);
    filtersEl.style.display = 'none';
    return;
  }

  // —— 大类标签筛选模式 ——
  filtersEl.style.display = 'flex';
  resultBar.innerHTML = '';

  DATA.forEach(d=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (active.has(d.key)?' on':'');
    chip.innerHTML = `${d.cat}<span class="cnt">${d.papers.length}</span>`;
    chip.onclick = ()=>{
      if(active.has(d.key)) active.delete(d.key); else active.add(d.key);
      render();
    };
    filtersEl.appendChild(chip);
  });

  DATA.forEach(d=>{
    const show = active.has(d.key);
    const g = document.createElement('div');
    g.className = 'group' + (show?'':' hidden');
    const papers = d.papers.map(p=>`
      <div class="paper">
        <div class="title">${p.t}</div>
        <div class="meta"><b>${p.a}</b> · ${p.m}</div>
      </div>`).join('');
    g.innerHTML = `
      <div class="group-head">
        <h2>${d.cat}</h2>
        <span class="tag">${d.papers.length} 篇</span>
        <span class="desc">${d.desc}</span>
      </div>
      <div class="papers">${papers}</div>`;
    groupsEl.appendChild(g);
  });
}

kwInput.addEventListener('input', render);
btnClear.onclick = ()=>{ kwInput.value=''; render(); };
btnReset.onclick = ()=>{ kwInput.value=''; active = new Set(DATA.map(d=>d.key)); render(); };
render();
</script>
</body>
</html>
